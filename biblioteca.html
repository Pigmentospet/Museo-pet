<link rel="apple-touch-icon" href="rena-avatar.JPG">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#C17B4A;--brand-dk:#9A5E33;--brand-lt:#D9A07A;
  --cream:#FDF6EE;--cream-dk:#F5E9D8;--ink:#3D2010;--ink-lt:#7A4820;
  --font:'Nunito',sans-serif;--font-ttl:'Cormorant Garamond',serif;
  --nav:50px;--footer:60px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;font-family:var(--font);-webkit-tap-highlight-color:transparent;}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;height:var(--nav);background:var(--brand);display:flex;align-items:center;justify-content:space-between;padding:0 12px;z-index:300;box-shadow:0 2px 8px rgba(0,0,0,.2);gap:10px;}
.nav-left{display:flex;align-items:center;gap:8px;min-width:0;}
.btn-back{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);border-radius:8px;color:var(--cream);font-family:var(--font);font-size:11px;font-weight:800;padding:5px 9px;cursor:pointer;white-space:nowrap;text-transform:uppercase;letter-spacing:.06em;flex-shrink:0;}
.btn-back:hover{background:rgba(255,255,255,.28);}
.nav-titles{min-width:0;}
.nav-brand{font-size:13px;font-weight:800;color:var(--cream);text-transform:uppercase;letter-spacing:.08em;line-height:1.15;white-space:nowrap;}
.nav-sub{font-size:10px;color:rgba(253,246,238,.7);font-weight:700;text-transform:uppercase;letter-spacing:.06em;}
.btn-menu{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);border-radius:8px;width:36px;height:36px;cursor:pointer;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;}
.btn-menu span{display:block;width:16px;height:2px;background:var(--cream);border-radius:2px;}

/* FOOTER */
footer{position:fixed;bottom:0;left:0;right:0;height:var(--footer);background:var(--brand);display:flex;align-items:center;justify-content:center;gap:10px;z-index:300;}
.ft-icon{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.16);transition:background .15s;flex-shrink:0;text-decoration:none;}
.ft-icon:hover,.ft-icon:active{background:rgba(255,255,255,.28);}
.ft-icon svg{width:18px;height:18px;fill:var(--cream);}

/* SCENE */
#sw{position:fixed;top:var(--nav);left:0;right:0;bottom:var(--footer);overflow-x:scroll;overflow-y:hidden;cursor:grab;-webkit-overflow-scrolling:touch;user-select:none;scroll-behavior:auto;background:linear-gradient(to bottom,#FFFFFF 50%,#8B5236 50%);}
#sw:active{cursor:grabbing;}
#sw::-webkit-scrollbar{display:none;}
#scene{position:relative;}
/* Capas — igual que index/galeria: divs con background-image, NUNCA <img> para assets de escena (regla iOS Safari) */
.layer{position:absolute;top:0;left:0;width:100%;height:100%;background-repeat:no-repeat;background-size:100% 100%;pointer-events:none;opacity:0;transition:opacity .25s;}
.layer.loaded{opacity:1;}
/* Capas "tile": imágenes de 3840×2419 (proporción 1.587). Alto = 100% de la escena, ancho = 31.74% (1080×1.587 / 5400). */

/* HOTSPOTS */
.hs{position:absolute;background:transparent;border:none;padding:0;cursor:pointer;z-index:20;-webkit-tap-highlight-color:rgba(193,123,74,.15);transition:transform .12s ease;}
.hs:hover{background:rgba(193,123,74,.08);}
/* Punto que late = se puede tocar. Lo estático no late. */
.hs::after{content:'';position:absolute;left:var(--dot-left,50%);top:var(--dot-top,50%);width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;background:var(--brand);border:2px solid var(--cream);box-shadow:0 0 0 0 rgba(193,123,74,.6);animation:hsPulse 1.9s ease-out infinite;pointer-events:none;}
/* El arco no lleva punto (igual que en las otras salas) */
.hs.nodot::after{display:none;}
.hs.nodot:hover{background:transparent;}
@keyframes hsPulse{0%{box-shadow:0 0 0 0 rgba(193,123,74,.6);transform:scale(1);}50%{transform:scale(1.12);}100%{box-shadow:0 0 0 11px rgba(193,123,74,0);transform:scale(1);}}

/* SCROLL HINT */
#hint{position:fixed;bottom:calc(var(--footer)+10px);right:14px;background:rgba(154,94,51,.88);color:var(--cream);border-radius:20px;padding:5px 13px;font-size:10px;font-weight:800;letter-spacing:.06em;pointer-events:none;opacity:1;transition:opacity 1s;z-index:290;}
#hint.hidden{opacity:0;}

/* MODALES */
.overlay{display:none;position:fixed;inset:0;background:rgba(40,18,6,.72);z-index:400;align-items:flex-end;justify-content:center;}
.overlay.open{display:flex;}
@media(min-width:600px){.overlay{align-items:center;}}
.modal{background:var(--cream);border-radius:20px 20px 0 0;width:100%;max-width:440px;max-height:90vh;overflow-y:auto;animation:sUp .22s ease;}
@media(min-width:600px){.modal{border-radius:20px;width:90%;}}
@keyframes sUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
.modal-head{background:var(--brand);border-radius:20px 20px 0 0;padding:14px 16px 12px;display:flex;align-items:center;gap:12px;position:relative;}
.modal-avatar{width:50px;height:50px;border-radius:50%;border:2px solid rgba(255,255,255,.35);object-fit:cover;flex-shrink:0;background:var(--brand-lt);}
.modal-head-name{font-family:'Cormorant Garamond',serif;font-size:25px;font-weight:700;color:var(--cream);line-height:1.1;}
.modal-head-sub{font-size:11px;font-weight:700;letter-spacing:.06em;color:rgba(253,246,238,.8);margin-top:3px;}
.modal-close{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.18);border:none;width:28px;height:28px;border-radius:50%;color:var(--cream);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.modal-close:hover{background:rgba(255,255,255,.3);}
.modal-body{padding:16px 16px 28px;}
.bubble-wrap{margin-bottom:14px;}
.bubble-tail{display:block;margin-left:18px;margin-top:-1px;}
.bubble-box{background:var(--cream-dk);border:1.5px solid rgba(193,123,74,.2);border-radius:4px 16px 16px 16px;padding:12px 14px;font-size:14px;line-height:1.65;color:var(--ink);}
.bubble-box b{font-weight:800;color:var(--brand-dk);}
.bubble-box em{font-style:italic;color:var(--brand);}
.door-cta{display:block;width:100%;padding:13px;background:var(--brand);color:var(--cream);font-family:var(--font);font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;border:none;border-radius:12px;cursor:pointer;margin-top:8px;transition:background .15s;}
.door-cta:hover{background:var(--brand-dk);}
.door-cta.sec{background:var(--cream-dk);color:var(--brand-dk);}
.door-cta.sec:hover{background:#e0cdb5;}
.door-cta.grn{background:#3D8B3D;color:#fff;}

/* Menú / salas */
.menu-item{display:flex;align-items:center;gap:12px;padding:12px 13px;background:white;border:1.5px solid rgba(193,123,74,.2);border-radius:12px;cursor:pointer;font-family:var(--font);width:100%;text-align:left;transition:all .15s;margin-bottom:8px;}
@media (hover:hover){.menu-item:hover{background:var(--cream-dk);border-color:var(--brand-lt);}}
.mi-num{width:30px;height:30px;border-radius:50%;background:var(--cream-dk);font-size:11px;font-weight:800;color:var(--brand-dk);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.mi-num.active{background:var(--brand);color:var(--cream);}
.mi-name{font-size:13px;font-weight:800;color:var(--ink);}
.mi-desc{font-size:11px;color:var(--ink-lt);}
.mi-arrow{font-size:14px;color:rgba(193,123,74,.5);margin-left:auto;}

/* ── LIBRO ABIERTO ── */
.libro-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;animation:sUp .22s ease;max-height:100%;}
.libro-top{display:flex;align-items:center;gap:10px;background:var(--brand);border-radius:30px;padding:6px 8px 6px 6px;color:var(--cream);max-width:92vw;}
.libro-top img{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.4);object-fit:cover;background:var(--brand-lt);}
.libro-top .lt{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;line-height:1.2;}
.libro-top .lt small{display:block;font-size:10px;font-weight:700;opacity:.8;letter-spacing:.05em;}
.libro-top button{background:rgba(255,255,255,.2);border:none;color:var(--cream);width:28px;height:28px;border-radius:50%;font-size:14px;cursor:pointer;}
.book{position:relative;width:min(92vw,380px,calc((100vh - 150px)*.611));aspect-ratio:1400/2290;background-repeat:no-repeat;background-size:274.2857% auto;background-position:18.85% 100%;container-type:inline-size;filter:drop-shadow(0 10px 22px rgba(0,0,0,.35));touch-action:pan-y;}
.book.der{background-position:73.77% 100%;}
.pg{position:absolute;top:12.5%;height:74%;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;color:var(--ink);animation:pgIn .25s ease;}
.pg::-webkit-scrollbar{display:none;}
.book.izq .pg{left:31%;width:61%;}
.book.der .pg{left:8.6%;width:70%;}
@keyframes pgIn{from{opacity:0;transform:translateX(var(--dir,12px));}to{opacity:1;transform:none;}}
.pg-kick{font-size:3cqw;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);}
.pg-title{font-family:var(--font-ttl);font-size:10cqw;font-weight:700;color:var(--brand-dk);line-height:1;margin:1cqw 0 2.5cqw;}
.pg-rena{font-size:3.5cqw;line-height:1.5;background:rgba(193,123,74,.12);border-radius:3px 3cqw 3cqw 3cqw;padding:2.2cqw 2.8cqw;margin-bottom:3cqw;}
.pg-rena b{color:var(--brand-dk);}
.pg-rena em{color:var(--brand);}
.pg-sec{font-size:2.8cqw;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--brand-dk);margin-bottom:1.8cqw;}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:1.8cqw;}
.chip{display:flex;align-items:center;gap:1.6cqw;background:rgba(255,255,255,.7);border:1px solid rgba(193,123,74,.25);border-radius:2.4cqw;padding:1cqw 1.4cqw 1cqw 1cqw;min-width:0;}
.chip .th{width:8.4cqw;height:8.4cqw;flex-shrink:0;border-radius:1.6cqw;background:var(--cream-dk);display:flex;align-items:center;justify-content:center;font-size:4.4cqw;overflow:hidden;}
.chip .th img{width:100%;height:100%;object-fit:cover;display:block;}
.chip span.n{font-size:2.9cqw;font-weight:800;line-height:1.15;color:var(--ink);}
.pg-next{margin-top:3cqw;font-size:3cqw;font-weight:800;color:var(--brand);text-align:right;animation:nudge 1.6s ease-in-out infinite;}
@keyframes nudge{0%,100%{transform:translateX(0);}50%{transform:translateX(1.2cqw);}}
.tip{display:flex;gap:2.4cqw;align-items:flex-start;margin-bottom:3.1cqw;}
.tip .ic{width:8.6cqw;height:8.6cqw;flex-shrink:0;border-radius:50%;background:rgba(193,123,74,.16);border:1px solid rgba(193,123,74,.35);display:flex;align-items:center;justify-content:center;font-size:4.4cqw;line-height:1;}
.tip .tx{font-size:3.5cqw;font-weight:700;line-height:1.35;color:var(--ink);}
.tags{display:flex;flex-wrap:wrap;gap:1cqw;margin-top:1cqw;}
.tag{font-size:2.5cqw;font-weight:800;background:var(--brand);color:var(--cream);border-radius:20px;padding:.5cqw 2cqw;letter-spacing:.02em;}
.libro-nav{display:flex;align-items:center;gap:14px;}
.libro-nav button{background:var(--brand);color:var(--cream);border:none;border-radius:20px;font-family:var(--font);font-size:12px;font-weight:800;letter-spacing:.06em;padding:9px 16px;cursor:pointer;min-width:94px;}
.libro-nav button:disabled{opacity:.35;cursor:default;}
.lp-dots{display:flex;gap:6px;}
.lp-dots i{width:7px;height:7px;border-radius:50%;background:rgba(253,246,238,.4);}
.lp-dots i.on{background:var(--cream);}
#modal-libro{align-items:center;}
</style>
</head>

    <div class="modal-head">
      <img src="rena-avatar.JPG" class="modal-avatar" alt="" onerror="this.style.background='var(--brand-lt)';this.removeAttribute('src')">
      <div><div class="modal-head-name">¿A dónde vamos?</div><div class="modal-head-sub">Rena te cuenta 🐾</div></div>

      <div class="bubble-wrap" style="margin-bottom:16px;">

        <div class="bubble-box"><b>¡Arf!</b> El museo tiene muchas salas — ¿quieres explorar otra? 🐾</div>
      </div>
      <button class="menu-item" onclick="irA('vestibulo')"><div class="mi-num">00</div><div><div class="mi-name">Vestíbulo de Rena</div><div class="mi-desc">Entrada principal</div></div><div class="mi-arrow">›</div></button>
      <button class="menu-item" onclick="irA('galeria')"><div class="mi-num">01</div><div><div class="mi-name">Galería de los Inmortales</div><div class="mi-desc">Retratos de mascotas</div></div><div class="mi-arrow">›</div></button>
      <button class="menu-item" onclick="irA('boutique')"><div class="mi-num">02</div><div><div class="mi-name">La Boutique</div><div class="mi-desc">Productos personalizados</div></div><div class="mi-arrow">›</div></button>
      <button class="menu-item" onclick="irA('taller')"><div class="mi-num">03</div><div><div class="mi-name">El Taller de Edith</div><div class="mi-desc">Proceso, envíos e info de valor</div></div><div class="mi-arrow">›</div></button>
      <button class="menu-item" onclick="irA('biblioteca')"><div class="mi-num active">05</div><div><div class="mi-name">Biblioteca de Cuidados</div><div class="mi-desc">Cómo cuidar tus productos · estás aquí</div></div><div class="mi-arrow">›</div></button>
      <button class="menu-item" onclick="irA('altar')"><div class="mi-num">04</div><div><div class="mi-name">Altar de los Recuerdos</div><div class="mi-desc">Para mascotas que ya partieron</div></div><div class="mi-arrow">›</div></button>
    </div>
  </div>
</div>

<script>
var sw=document.getElementById('sw'), scene=document.getElementById('scene');
var PX_W=2620, PX_H=1080, TILE_W=1714;     /* escena en "unidades": 1080 de alto; los PNG de 3840×2419 miden 1714×1080 */
var RATIO=PX_W/PX_H;
var SCALE=0.55; /* mismo factor que el vestíbulo y el taller */

function setSceneSize(){
  var avail=window.innerHeight-50-60, h=avail*SCALE;
  scene.style.width=(h*RATIO)+'px'; scene.style.height=h+'px';
  scene.style.marginTop=((avail-h)/2)+'px';
}
setSceneSize();
window.addEventListener('resize',setSceneSize);

/* Capas: divs con background-image + preloader (nunca <img> en la escena: regla iOS Safari) */
function preloadLayer(el,src){
  var pre=new Image();
  pre.onload=function(){ el.style.backgroundImage='url("'+src+'")'; el.classList.add('loaded'); };
  pre.onerror=function(){};
  pre.src=src;
}
/* Contenedor recortado (igual que el taller): lo que se sale de la escena no alarga el scroll */
var tilesBox=document.createElement('div');
tilesBox.style.cssText='position:absolute;left:0;top:-100%;width:100%;height:300%;overflow:hidden;pointer-events:none;z-index:2;';
scene.appendChild(tilesBox);
function box(id,z,left,top,w,h,file){
  var d=document.createElement('div'); d.id=id; d.className='layer';
  d.style.cssText='z-index:'+z+';left:'+(left/PX_W*100)+'%;top:'+((top+PX_H)/(PX_H*3)*100)+'%;width:'+(w/PX_W*100)+'%;height:'+(h/(PX_H*3)*100)+'%;';
  tilesBox.appendChild(d); preloadLayer(d,file); return d;
}

/* ── ESTANTE ── biblioteca-bg.PNG (3840×2419): alto completo de la escena, pegado a la izquierda */
var BG_X=40, K=TILE_W/2000; /* K: de px de la imagen (vista a 2000 de ancho) a unidades de escena */
box('layer-bg',2,BG_X,0,TILE_W,PX_H,'biblioteca-bg.PNG');

/* ── VENTANA a la derecha del estante (mismo PNG que el taller). Se coloca por su parte visible:
   cx = centro en X, tw = ancho de la ventana, bottom = dónde apoya su borde de abajo (todo en unidades de escena) */
var VENTANA={cx:1560, tw:420, bottom:560};
(function(){
  var d=document.createElement('div'); d.className='layer'; d.style.zIndex=1; tilesBox.appendChild(d);
  var img=new Image();
  img.onload=function(){
    var nw=img.naturalWidth, nh=img.naturalHeight, fx1=0, fx2=1, fy1=0, fy2=1;
    try{
      var cw=480, ch=Math.round(cw*nh/nw), cv=document.createElement('canvas'); cv.width=cw; cv.height=ch;
      var c2=cv.getContext('2d'); c2.drawImage(img,0,0,cw,ch);
      var px=c2.getImageData(0,0,cw,ch).data, x1=cw,x2=-1,y1=ch,y2=-1;
      for(var y=0;y<ch;y++)for(var x=0;x<cw;x++){ if(px[(y*cw+x)*4+3]>24){ if(x<x1)x1=x; if(x>x2)x2=x; if(y<y1)y1=y; if(y>y2)y2=y; } }
      if(x2>=0){ fx1=x1/cw; fx2=(x2+1)/cw; fy1=y1/ch; fy2=(y2+1)/ch; }
    }catch(e){}
    var TW=VENTANA.tw/(fx2-fx1), TH=TW*nh/nw;
    var left=VENTANA.cx-((fx1+fx2)/2)*TW, top=VENTANA.bottom-fy2*TH;
    d.style.left=(left/PX_W*100)+'%'; d.style.top=((top+PX_H)/(PX_H*3)*100)+'%';
    d.style.width=(TW/PX_W*100)+'%'; d.style.height=(TH/(PX_H*3)*100)+'%';
    d.style.backgroundImage='url("taller-ventana.PNG")'; d.classList.add('loaded');
  };
  img.onerror=function(){};
  img.src='taller-ventana.PNG';
})();

/* ── ARCO DE SALIDA: capa de 5400×1080 pegada al borde derecho (su arco ocupa el 13.3% de la derecha, igual que en las otras salas) */
box('layer-arco',12,PX_W-5400,0,5400,PX_H,'arco-salida.PNG');
var elArco=document.createElement('button');
elArco.className='hs nodot';
elArco.style.cssText='left:'+((PX_W-5400*0.133)/PX_W*100)+'%;top:0;width:'+(5400*0.133/PX_W*100)+'%;height:100%;z-index:20;';
elArco.setAttribute('aria-label','Ver todas las salas');
elArco.onclick=function(){ openModal('menu'); };
scene.appendChild(elArco);

/* ── PUNTOS TÁCTILES sobre los libros del estante ──
   Cajas en px de la imagen vista a 2000 de ancho: [x1,y1,x2,y2] y posición del punto (dx,dy). Se pueden mover con estos números. */
var LIBROS=[
  {k:'bebidas',    box:[690,290,860,500],  dot:[748,318], label:'Bebidas'},
  {k:'accesorios', box:[565,515,690,725],  dot:[627,545], label:'Accesorios'},
  {k:'prendas',    box:[355,740,460,945],  dot:[407,768], label:'Prendas'},
  {k:'cuadros',    box:[500,965,650,1150], dot:[615,995], label:'Cuadros'}
];
LIBROS.forEach(function(L){
  var b=L.box, x1=BG_X+b[0]*K, y1=b[1]*K, w=(b[2]-b[0])*K, h=(b[3]-b[1])*K;
  var el=document.createElement('button'); el.className='hs';
  el.style.cssText='left:'+(x1/PX_W*100)+'%;top:'+(y1/PX_H*100)+'%;width:'+(w/PX_W*100)+'%;height:'+(h/PX_H*100)+'%;'+
    '--dot-left:'+((L.dot[0]-b[0])/(b[2]-b[0])*100)+'%;--dot-top:'+((L.dot[1]-b[1])/(b[3]-b[1])*100)+'%;';
  el.setAttribute('aria-label','Cuidados: '+L.label);
  el.onclick=function(){ openLibro(L.k); };
  scene.appendChild(el);
});

/* ── CONTENIDO DE LOS LIBROS ── */
var PRODS={
  'taza-clasica':{n:'Taza clásica',f:'prod-taza-clasica.png'},
  'taza-jumbo':{n:'Taza jumbo',f:'prod-taza-jumbo.png'},
  'vaso-bambu':{n:'Vaso de bambú',f:'prod-vaso-bambu.png'},
  'termo-12':{n:'Termo 12',f:'prod-termo-12.png'},
  'termo-887':{n:'Termo 887',f:'prod-termo-887.png'},
  'termo-tumbler':{n:'Termo tumbler',f:'prod-termo-tumbler.png'},
  'funda':{n:'Funda de celular',f:'prod-funda-celular.png'},
  'llavero':{n:'Llavero',f:'prod-llavero.png'},
  'esfera':{n:'Esfera navideña',e:'🎄'},
  'pelota':{n:'Pelota',e:'⚾'},
  'playera':{n:'Playera',f:'prod-playera.png'},
  'hoodie':{n:'Hoodie',f:'prod-hoodie.png'},
  'tote':{n:'Tote bag',f:'prod-tote-bag.png'},
  'gorra':{n:'Gorra',f:'prod-gorra.png'},
  'lienzo':{n:'Lienzo',f:'prod-lienzo.png'},
  'acuarela':{n:'Acuarela',f:'prod-acuarela.png'},
  'cuadro-escritorio':{n:'Cuadro de escritorio',f:'prod-cuadro-escritorio.png'},
  'cuadro-mini':{n:'Cuadro mini',f:'prod-cuadro-mini.png'},
  'kit-caricatura':{n:'Kit caricatura',f:'prod-kit-caricatura.png'},
  'kit-detallado':{n:'Kit detallado',f:'prod-kit-detallado.png'}
};
/* tip: i = icono, t = texto, p = productos a los que aplica (sin p = aplica a todos los del libro) */
var LIB={
  bebidas:{titulo:'Bebidas',kick:'Para tu bebida',
    rena:'<b>¡Arf!</b> 🐾 Para que tu taza, vaso o termo dure muchísimo, mi humana Edith te deja aquí sus cuidados. <em>¡Grrr-enial!</em>',
    prods:['taza-clasica','taza-jumbo','vaso-bambu','termo-12','termo-887','termo-tumbler'],
    pags:[[
      {i:'☕',t:'Apta para bebidas frías y calientes.',p:['taza-clasica','taza-jumbo']},
      {i:'🥤',t:'Solo para bebidas frías o a temperatura ambiente.',p:['vaso-bambu','termo-12','termo-887','termo-tumbler']},
      {i:'🧼',t:'Lava a mano con jabón suave.'},
      {i:'🚫',t:'No lo metas al lavavajillas, horno ni microondas.'},
      {i:'☀️',t:'Evita el calor extremo y la luz solar directa por mucho tiempo.'}
    ]]},
  accesorios:{titulo:'Accesorios',kick:'Para tus accesorios',
    rena:'<b>¡Woof!</b> 🐾 Fundas, llaveros y adornos también piden mimos. Mi humana Edith te cuenta cómo cuidarlos. <em>¡Ya casi, ya casi!</em>',
    prods:['funda','llavero','esfera','pelota'],
    pags:[[
      {i:'🧽',t:'Limpia con un paño suave y húmedo.',p:['funda']},
      {i:'🧽',t:'Limpia con un paño suave y seco.',p:['llavero','esfera','pelota']},
      {i:'🧪',t:'Evita químicos agresivos y productos abrasivos.',p:['funda','llavero']},
      {i:'☀️',t:'No lo expongas a calor extremo ni a luz solar directa prolongada.'}
    ],[
      {i:'💥',t:'Manéjalo con cuidado: los golpes pueden dañar la resina.',p:['llavero']},
      {i:'💥',t:'Evita golpes o caídas para proteger la pintura.',p:['esfera','pelota']},
      {i:'⚠️',t:'No dejes la funda sobre superficies rugosas: pueden rayarla.',p:['funda']},
      {i:'📦',t:'Guárdala en un lugar seco y fresco.',p:['esfera','pelota']}
    ]]},
  prendas:{titulo:'Prendas',kick:'Para tu prenda',
    rena:'<b>¡Guau!</b> 🐾 Tus prendas con ilustración merecen lavados suaves. Mi humana Edith te enseña cómo. <em>¡Grrr-antizado!</em>',
    prods:['playera','hoodie','tote','gorra'],
    pags:[[
      {i:'🧼',t:'Lava a mano con agua fría y detergente suave.'},
      {i:'🧺',t:'También puedes usar ciclo delicado con agua fría.',p:['playera','hoodie','tote']},
      {i:'🚫',t:'Evita la lavadora y la secadora.',p:['gorra']},
      {i:'🚫',t:'No uses blanqueador.'},
      {i:'✋',t:'No frotes directamente sobre la pintura.'},
      {i:'🌬️',t:'Seca al aire, sin secadora.'}
    ],[
      {i:'♨️',t:'Si planchas, hazlo del revés, a baja temperatura y evitando la zona pintada.',p:['playera','hoodie','tote']},
      {i:'🚫',t:'No planches ni dobles la zona pintada.',p:['gorra']},
      {i:'👕',t:'Evita arrugar el área de pintura.',p:['playera','hoodie','tote']},
      {i:'🧢',t:'Sécala manteniéndola en su forma.',p:['gorra']}
    ]]},
  cuadros:{titulo:'Cuadros',kick:'Para tu cuadro',
    rena:'<b>¡Woof woof!</b> 🐾 Los cuadros y lienzos de mi humana Edith se cuidan con cariño. <em>¡Mira cómo!</em>',
    prods:['lienzo','acuarela','cuadro-escritorio','cuadro-mini','kit-caricatura','kit-detallado'],
    pags:[[
      {i:'🧽',t:'Sécalo con una toalla seca.'},
      {i:'🖼️',t:'Ponlo en un lugar donde no lo muevan constantemente.'},
      {i:'☀️',t:'Evita la luz solar directa y la humedad.'},
      {i:'🧪',t:'No uses productos químicos.'},
      {i:'✋',t:'Manéjalo con cuidado para evitar daños en la pintura.'}
    ]]}
};

/* ── MODAL LIBRO ── */
var libroKey=null, libroPag=0, libroDir=1;
var bookEl=document.getElementById('book');
(function(){ var im=new Image(); im.onload=function(){ bookEl.style.backgroundImage='url("libro-abierto.PNG")'; }; im.onerror=function(){}; im.src='libro-abierto.PNG'; })();
function chipHTML(k){
  var p=PRODS[k], th=p.f?'<img src="'+p.f+'" alt="" loading="lazy" onerror="this.parentNode.textContent=\'🐾\'">':(p.e||'🐾');
  return '<div class="chip"><div class="th">'+th+'</div><span class="n">'+p.n+'</span></div>';
}
function openLibro(k){ libroKey=k; libroPag=0; libroDir=1; renderLibro(); openModal('libro'); }
function renderLibro(){
  var L=LIB[libroKey], total=1+L.pags.length, h='';
  bookEl.className='book '+(libroPag===0?'izq':'der');
  document.getElementById('lb-title').innerHTML='Cuidados · '+L.titulo+'<small>'+(libroPag===0?'Portada':'Página '+libroPag+' de '+L.pags.length)+'</small>';
  if(libroPag===0){
    h='<div class="pg-kick">Biblioteca de cuidados</div><div class="pg-title">'+L.titulo+'</div>'+
      '<div class="pg-rena">'+L.rena+'</div><div class="pg-sec">Aplica a</div><div class="chips">'+L.prods.map(chipHTML).join('')+'</div>'+
      '<div class="pg-next">Pasa la página →</div>';
  }else{
    h='<div class="pg-kick">'+L.kick+'</div><div class="pg-title" style="font-size:7.5cqw;margin-bottom:3.5cqw;">Cuidados</div>';
    L.pags[libroPag-1].forEach(function(tp){
      h+='<div class="tip"><div class="ic">'+tp.i+'</div><div><div class="tx">'+tp.t+'</div>'+
        (tp.p?'<div class="tags">'+tp.p.map(function(k){return '<span class="tag">'+PRODS[k].n+'</span>';}).join('')+'</div>':'')+'</div></div>';
    });
  }
  bookEl.innerHTML='<div class="pg" style="--dir:'+(libroDir*14)+'px">'+h+'</div>';
  document.getElementById('lb-prev').disabled=libroPag===0;
  document.getElementById('lb-next').disabled=libroPag===total-1;
  var d=''; for(var i=0;i<total;i++) d+='<i'+(i===libroPag?' class="on"':'')+'></i>';
  document.getElementById('lb-dots').innerHTML=d;
}
function libroIr(dir){
  var total=1+LIB[libroKey].pags.length, n=libroPag+dir;
  if(n<0||n>=total)return; libroDir=dir; libroPag=n; renderLibro();
}
(function(){ var x0=null;
  bookEl.addEventListener('touchstart',function(e){x0=e.touches[0].clientX;},{passive:true});
  bookEl.addEventListener('touchend',function(e){ if(x0===null)return; var dx=e.changedTouches[0].clientX-x0; x0=null; if(Math.abs(dx)>50) libroIr(dx<0?1:-1); },{passive:true});
})();
document.addEventListener('keydown',function(e){ if(!document.getElementById('modal-libro').classList.contains('open'))return; if(e.key==='ArrowRight')libroIr(1); if(e.key==='ArrowLeft')libroIr(-1); });

/* ── MODALES / NAVEGACIÓN ── */
function openModal(id){document.getElementById('modal-'+id).classList.add('open');}
function closeModal(id){document.getElementById('modal-'+id).classList.remove('open');}
document.querySelectorAll('.overlay').forEach(function(o){o.addEventListener('click',function(e){if(e.target===o)o.classList.remove('open');});});
document.addEventListener('keydown',function(e){if(e.key==='Escape')document.querySelectorAll('.overlay.open').forEach(function(o){o.classList.remove('open');});});
var SALAS={vestibulo:{url:'index.html'},galeria:{url:'galeria.html'},boutique:{url:'boutique.html'},taller:{url:'taller.html'},biblioteca:{url:'biblioteca.html'},altar:{url:'altar.html'}};
function irA(key){document.querySelectorAll('.overlay.open').forEach(function(o){o.classList.remove('open');});var s=SALAS[key];if(s&&s.url)setTimeout(function(){window.location.href=s.url;},150);}

/* ── SCROLL — mismo patrón que el taller ── */
var hint=document.getElementById('hint');var hintHidden=false;
function hideHint(){if(hintHidden)return;hintHidden=true;hint.classList.add('hidden');}
setTimeout(hideHint,3500);
sw.addEventListener('wheel',function(e){e.preventDefault();sw.scrollLeft+=e.deltaY*1.3;},{passive:false});
var isDrag=false,sX=0,sL=0;
sw.addEventListener('mousedown',function(e){isDrag=true;sX=e.pageX;sL=sw.scrollLeft;sw.style.cursor='grabbing';});
window.addEventListener('mousemove',function(e){if(!isDrag)return;sw.scrollLeft=sL-(e.pageX-sX);});
window.addEventListener('mouseup',function(){isDrag=false;sw.style.cursor='grab';});
var tSX=0,tSL=0,tLX=0,tV=0,tT=0,tR=null;
sw.addEventListener('touchstart',function(e){if(tR){cancelAnimationFrame(tR);tR=null;}tSX=tLX=e.touches[0].clientX;tSL=sw.scrollLeft;tV=0;tT=Date.now();},{passive:true});
sw.addEventListener('touchmove',function(e){var x=e.touches[0].clientX;tV=(tLX-x)/(Date.now()-tT+1);tT=Date.now();tLX=x;sw.scrollLeft=tSL+(tSX-x);},{passive:true});
sw.addEventListener('touchend',function(){var v=tV*16;(function step(){if(Math.abs(v)<.5)return;sw.scrollLeft+=v;v*=.96;tR=requestAnimationFrame(step);})();},{passive:true});
sw.addEventListener('scroll',hideHint,{passive:true});
window.addEventListener('load',function(){sw.scrollLeft=0;});

</script>
